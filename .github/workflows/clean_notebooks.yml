name: Clean notebook widget metadata

on:
  push:
    paths:
      - '**.ipynb'

permissions:
  contents: write        # ← allows the Action to commit back

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nbformat
        run: pip install nbformat --quiet

      - name: Strip widget metadata from notebooks
        run: |
          python - <<'EOF'
          import json, glob

          for path in glob.glob("**/*.ipynb", recursive=True):
              with open(path, 'r') as f:
                  nb = json.load(f)
              changed = False
              if 'widgets' in nb.get('metadata', {}):
                  del nb['metadata']['widgets']
                  changed = True
              for cell in nb.get('cells', []):
                  for output in cell.get('outputs', []):
                      if output.get('metadata'):
                          output['metadata'] = {}
                          changed = True
              if changed:
                  with open(path, 'w') as f:
                      json.dump(nb, f, indent=1)
                  print(f"  cleaned: {path}")
              else:
                  print(f"  ok:      {path}")
          EOF

      - name: Commit cleaned notebooks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: strip widget metadata from notebooks"
          file_pattern: '**.ipynb'
