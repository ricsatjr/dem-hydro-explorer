name: Clean notebook widget metadata

on:
  push:
    paths:
      - '**.ipynb'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nbformat
        run: pip install nbformat --quiet

      - name: Strip widget metadata
        run: python scripts/clean_notebooks.py

      - name: Commit cleaned notebooks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: strip widget metadata from notebooks"
          file_pattern: '**.ipynb'
